# Merge this block into the active Hermes profile's config.yaml.
mcp_servers:
  fathom:
    url: "https://api.fathom.ai/mcp"
    auth: oauth

# Keep the API server on loopback; expose the POC webhook service through a
# tunnel instead of exposing Hermes itself.
gateway:
  platforms:
    api_server:
      enabled: true

